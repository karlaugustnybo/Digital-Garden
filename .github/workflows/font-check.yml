name: Font Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  check-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate managed fonts
        run: bun run check-fonts
